<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="blog-post-card">

        <img
            class="post-img"
            src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg"
            alt="A detailed cover photo"
        >

        <div class="post-content">

            <h2 class="post-title">My First Blog Post</h2>

            <p class="post-excerpt">
                This is a short summary of my first blog post and what readers can expect to learn.
            </p>

            <a class="read-more" href="#">Read More</a>

        </div>

    </div>

</body>

</html>

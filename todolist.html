<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <link href="styles.css" rel="stylesheet" />
    <title>Styled To-Do List</title>
</head>

<body>

    <ul class="todo-list">

        <li>
            <input type="checkbox" id="html">
            <label for="html">HTML</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">
                        Learn HTML
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="css">
            <label for="css">CSS</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">
                        FreeCodeCamp
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="javascript">
            <label for="javascript">JavaScript</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">
                        Learn to Code
                    </a>
                </li>
            </ul>
        </li>

        <li>
            <input type="checkbox" id="coding">
            <label for="coding">Coding</label>

            <ul class="sub-item">
                <li>
                    <a class="sub-item-link" href="https://www.freecodecamp.org" target="_blank">
                        Learn CSS
                    </a>
                </li>
            </ul>
        </li>

    </ul>

</body>

</html>
